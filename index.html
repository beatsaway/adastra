<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ad Astra · Ship</title>
  <link rel="stylesheet" href="styles.css?v=20260817ap" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23c5ccd6' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2344aaff'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="loader">
    <div class="loader-panel">
      <h1>Loading</h1>
      <p id="load-status">…</p>
      <div class="bar-track">
        <div id="load-bar" class="bar-fill"></div>
      </div>
      <div id="load-pct">0%</div>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div class="panel">
      <h1>Systems Online</h1>
      <p id="enter-note">You start with 1000 data points to rebuild the ship.</p>
      <div class="enter-actions">
        <button id="start-btn" type="button">Enter Ship</button>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair">⊹</div>
    <div id="prompt" class="hidden">Press E</div>
    <button id="help-btn" type="button" aria-label="Menu" title="Menu">
      <span class="menu-caret" aria-hidden="true"></span>
      <span id="hud-room-name" class="hud-room-name"></span>
    </button>
    <div id="top-menu" class="hidden">
      <div id="room-opt-list"></div>
      <button id="goto-opt" type="button">Go to …</button>
      <button id="settings-opt" type="button">Settings</button>
    </div>
    <div id="mobile-controls" class="hidden">
      <div id="move-zone" class="stick-zone">
        <div id="move-base" class="stick-base"><div id="move-knob" class="stick-knob"></div></div>
      </div>
      <div id="look-zone" class="stick-zone">
        <div id="look-base" class="stick-base"><div id="look-knob" class="stick-knob"></div></div>
      </div>
    </div>
  </div>

  <div id="enter-veil" aria-hidden="true"></div>

  <div id="year-flash" aria-hidden="true"></div>

  <script type="module" src="js/main.js?v=20260817ap"></script>
</body>
</html>
